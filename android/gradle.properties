# Reduzierter Heap für 8GB-Systeme (kritisch!)
org.gradle.jvmargs=-Xmx768m -XX:+UseG1GC -XX:InitiatingHeapOccupancyPercent=55 -XX:+ExplicitGCInvokesConcurrent -XX:MaxGCPauseMillis=150

# Weitere Speicher-sparende Gradle-Einstellungen
org.gradle.parallel=false
org.gradle.workers.max=2
org.gradle.configureondemand=true

# AndroidX-Konfiguration (migration)
android.useAndroidX=true
android.enableJetifier=true

# This builtInKotlin flag was added automatically by Flutter migrator
android.builtInKotlin=false
# This newDsl flag was added automatically by Flutter migrator
android.newDsl=false